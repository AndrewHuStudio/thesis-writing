<p><strong>问题：</strong>EICU S152／抢救 S155 组团从哪条公共通道进入，门首先进入哪个空间？</p>
<p><strong>我的判断：</strong>污洗、处置改接 EICU；治疗、器械改接抢救组团内部。东侧边界看似连续实体墙，不能继续把这些小间直接接东侧通道 S166。倾向组团由南侧 S165 进入，但开口不足以确认，暂未补该外部连接。</p>
